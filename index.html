<title>우리반 칭찬 기록부</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: 생활기록부 한 장 — 왼쪽 작성 카드, 오른쪽 누적 기록표. 좁으면 한 줄로 쌓임 */
:root{
  --paper:#f7f8f6; --sheet:#ffffff; --ink:#1d2a3a; --muted:#5d6876; --line:#d9dee3;
  --stamp:#c8402f; --stamp-soft:#fbe9e5; --accent:#2c4f7c; --accent-soft:#e6edf6;
  --f-display:"Gowun Batang","Noto Serif KR",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#12171d; --sheet:#1a2129; --ink:#e7ebef; --muted:#9aa5b1; --line:#2d3743;
  --stamp:#ee7a66; --stamp-soft:#3a2420; --accent:#8fb3e0; --accent-soft:#1f2c3c; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#12171d; --sheet:#1a2129; --ink:#e7ebef; --muted:#9aa5b1; --line:#2d3743;
  --stamp:#ee7a66; --stamp-soft:#3a2420; --accent:#8fb3e0; --accent-soft:#1f2c3c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;border-bottom:2px solid var(--ink);padding-bottom:14px}
h1{font-family:var(--f-display);font-size:clamp(26px,4vw,36px);margin:0;letter-spacing:-.5px;text-wrap:balance}
.sub{color:var(--muted);margin:2px 0 0;font-size:14px}
.class-in{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.class-in input{width:130px}
.grid{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:20px}
h2{font-family:var(--f-display);font-size:19px;margin:0 0 14px}
form{display:flex;flex-direction:column;gap:14px}
.row{display:grid;grid-template-columns:90px 1fr;gap:10px}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:8px 10px;width:100%}
textarea{min-height:110px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cats input{position:absolute;opacity:0;width:1px;height:1px}
.cats span{display:inline-block;padding:5px 11px;border:1px solid var(--line);border-radius:999px;font-size:13px;font-weight:500;color:var(--ink);cursor:pointer}
.cats input:checked+span{background:var(--stamp);border-color:var(--stamp);color:var(--sheet)}
.cats input:focus-visible+span{outline:2px solid var(--accent);outline-offset:1px}
button{font:inherit;font-weight:600;border-radius:4px;padding:9px 16px;cursor:pointer;border:1px solid transparent}
.btn-main{background:var(--ink);color:var(--sheet)}
.btn-main:hover{opacity:.88}
.btn-sheet{background:var(--accent);color:var(--sheet);display:inline-flex;align-items:center;gap:8px}
.btn-sheet:hover{opacity:.9}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn-sm{padding:3px 9px;font-size:12.5px;font-weight:500}
.btn-danger{background:var(--stamp);color:var(--sheet)}
.form-actions{display:flex;gap:8px;flex-wrap:wrap}
.msg{font-size:13px;min-height:1.2em;color:var(--muted);margin:0}
.msg.err{color:var(--stamp)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.toolbar .left{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar select,.toolbar input{width:auto;min-width:120px;padding:6px 9px;font-size:14px}
.tally{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.tally button{background:var(--accent-soft);color:var(--ink);border:1px solid transparent;font-weight:500;font-size:13px;padding:4px 10px;border-radius:999px}
.tally button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:600}
.tally b{font-variant-numeric:tabular-nums;color:var(--stamp);margin-left:3px}
.table-box{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:620px}
th{text-align:left;font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:600;border-bottom:1px solid var(--ink);padding:8px 8px}
td{border-bottom:1px solid var(--line);padding:10px 8px;vertical-align:top}
td.num,td.date{font-variant-numeric:tabular-nums;white-space:nowrap}
td.content{min-width:220px;white-space:pre-wrap}
.chip{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--stamp-soft);color:var(--stamp);font-weight:600;white-space:nowrap}
.acts{display:flex;gap:4px;white-space:nowrap}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty .seal{width:64px;height:64px;margin:0 auto 12px;border:2px solid var(--stamp);border-radius:50%;display:grid;place-items:center;color:var(--stamp);font-family:var(--f-display);font-weight:700;font-size:18px;transform:rotate(-8deg)}
.teacher{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;background:var(--accent-soft);border-radius:6px;padding:12px 16px}
.teacher .who{font-size:13px;font-weight:600;color:var(--accent);letter-spacing:.04em}
.switch{display:flex;align-items:center;gap:10px;font-size:14.5px;font-weight:600;color:var(--ink);cursor:pointer;flex-direction:row}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .track{width:44px;height:24px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .15s}
.switch .track::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--sheet);transition:transform .15s}
.switch input:checked+.track{background:var(--stamp)}
.switch input:checked+.track::after{transform:translateX(20px)}
.switch input:focus-visible+.track{outline:2px solid var(--accent);outline-offset:2px}
.state{font-size:13px;color:var(--muted)}
.sealed{text-align:center;padding:28px 16px 20px;color:var(--muted);border-bottom:1px dashed var(--line);margin-bottom:16px}
.sealed .seal{width:72px;height:72px;margin:0 auto 12px;border:2px solid var(--stamp);border-radius:50%;display:grid;place-items:center;color:var(--stamp);font-family:var(--f-display);font-weight:700;font-size:15px;transform:rotate(-8deg);line-height:1.2}
.sealed p{margin:0}
.mine-h{font-size:14px;font-weight:600;margin:0 0 8px}
.notice{background:var(--stamp-soft);color:var(--ink);border-radius:4px;padding:10px 12px;font-size:13.5px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>우리반 칭찬 기록부</h1>
      <p class="sub">친구의 모범 행동을 보면 그때그때 적어 주세요. 구체적으로 쓸수록 좋아요.</p>
    </div>
    <label class="class-in" for="className">학급
      <input id="className" placeholder="예: 2학년 3반">
    </label>
  </header>

  <p class="notice" id="offline" hidden>저장 기능에 연결하지 못했습니다. 로그인한 상태로 claude.ai에서 이 페이지를 열어 주세요. 지금 입력한 내용은 저장되지 않습니다.</p>

  <div class="teacher" id="teacherBar" hidden>
    <span class="who">선생님 전용</span>
    <label class="switch" for="showToggle">
      <input type="checkbox" id="showToggle">
      <span class="track" aria-hidden="true"></span>
      학생에게 누적 기록 보이기
    </label>
    <span class="state" id="toggleState"></span>
  </div>

  <div class="grid">
    <section class="card" aria-labelledby="formTitle">
      <h2 id="formTitle">친구 칭찬하기</h2>
      <form id="f" novalidate>
        <div class="row">
          <label for="num">번호<input id="num" type="number" min="1" max="50" inputmode="numeric" placeholder="12"></label>
          <label for="name">칭찬할 친구<input id="name" placeholder="친구 이름" autocomplete="off" list="names"></label>
          <datalist id="names"></datalist>
        </div>
        <label for="date">날짜<input id="date" type="date"></label>
        <div>
          <label style="margin-bottom:6px">칭찬 영역</label>
          <div class="cats" id="cats" role="radiogroup" aria-label="칭찬 영역"></div>
        </div>
        <label for="content">구체적인 행동
          <textarea id="content" placeholder="언제, 어디서, 무엇을 했는지 적어 주세요. 예: 점심시간 후 아무도 시키지 않았는데 교실 분리수거함을 정리함."></textarea>
        </label>
        <label for="writer">쓴 사람<input id="writer" placeholder="내 이름"></label>
        <div class="form-actions">
          <button type="submit" class="btn-main" id="saveBtn">기록 저장</button>
          <button type="button" class="btn-ghost" id="cancelEdit" hidden>수정 취소</button>
        </div>
        <p class="msg" id="msg" role="status"></p>
      </form>
    </section>

    <section class="card" aria-labelledby="listTitle">
      <div class="toolbar">
        <h2 id="listTitle" style="margin:0">누적 기록 <span id="count" style="color:var(--muted);font-family:var(--f-body);font-size:15px"></span></h2>
        <button class="btn-sheet" id="exportBtn" type="button" hidden>
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="1.5" width="13" height="13" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M1.5 6h13M1.5 10h13M6 1.5v13" stroke="currentColor" stroke-width="1.2" fill="none"/></svg>
          시트로 내보내기 (.xlsx)
        </button>
      </div>
      <div class="sealed" id="sealed" hidden>
        <div class="seal" aria-hidden="true">비공개</div>
        <p>지금은 선생님이 칭찬을 모으는 중이라 다른 친구의 기록은 보이지 않아요.</p>
      </div>
      <p class="mine-h" id="mineH" hidden>내가 쓴 칭찬</p>
      <div class="toolbar" id="filters">
        <div class="left">
          <select id="fCat" aria-label="영역으로 거르기"><option value="">모든 영역</option></select>
          <input id="fText" type="search" placeholder="이름·내용 검색" aria-label="검색">
        </div>
        <p class="msg" id="exportMsg" role="status" style="margin:0"></p>
      </div>
      <div class="tally" id="tally" aria-label="학생별 칭찬 횟수"></div>
      <div class="table-box">
        <table>
          <thead><tr><th>날짜</th><th>번호</th><th>이름</th><th>영역</th><th>구체적인 행동</th><th>쓴 사람</th><th></th></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div class="empty" id="empty">
        <div class="seal" aria-hidden="true">칭찬</div>
        <p>아직 기록이 없습니다.<br>왼쪽에서 학생 이름과 행동을 적고 <b>기록 저장</b>을 누르면 여기에 쌓입니다.</p>
      </div>
    </section>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const CATS=["학업·탐구","배려·나눔","봉사","리더십","질서·생활","성실·책임","기타"];
const $=id=>document.getElementById(id);
let col=null, settingsRef=null, rows=[], editingId=null, nameFilter="", pendingDel=null;
let isTeacher=false, myId=null, showRecords=false, settingsLoaded=false;

$("cats").innerHTML=CATS.map((c,i)=>`<label style="flex-direction:row;font-weight:500"><input type="radio" name="cat" id="cat${i}" value="${c}" ${i===0?"checked":""}><span>${c}</span></label>`).join("");
$("fCat").innerHTML+=CATS.map(c=>`<option>${c}</option>`).join("");
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
$("date").value=today();
try{$("className").value=localStorage.getItem("className")||"";$("writer").value=localStorage.getItem("writer")||""}catch(e){}
$("className").addEventListener("change",e=>{try{localStorage.setItem("className",e.target.value)}catch(_){}});

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dataOf=d=>typeof d.data==="function"?d.data():d.data;
const sorted=list=>[...list].sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.createdAt||0)-(a.createdAt||0));
const isMine=r=>myId&&r.authorId===myId;
const canTouch=r=>isTeacher||isMine(r);

function render(){
  const seeAll=isTeacher||showRecords;
  $("sealed").hidden=seeAll||!settingsLoaded;
  $("mineH").hidden=seeAll;
  $("filters").hidden=!seeAll;
  $("tally").hidden=!seeAll;
  $("exportBtn").hidden=!isTeacher;
  $("toggleState").textContent=showRecords?"지금 학생 화면: 모든 기록이 보여요":"지금 학생 화면: 자기가 쓴 칭찬만 보여요";
  $("showToggle").checked=showRecords;

  const base=seeAll?rows:rows.filter(isMine);
  const cat=$("fCat").value, q=$("fText").value.trim();
  const tally={};
  base.forEach(r=>{const k=r.name;if(!k)return;tally[k]=tally[k]||{n:0,num:r.num};tally[k].n++});
  const tk=Object.keys(tally).sort((a,b)=>(tally[a].num||999)-(tally[b].num||999)||a.localeCompare(b,"ko"));
  $("tally").innerHTML=seeAll&&tk.length?[`<button type="button" data-n="" aria-pressed="${!nameFilter}">전체<b>${base.length}</b></button>`]
    .concat(tk.map(k=>`<button type="button" data-n="${esc(k)}" aria-pressed="${nameFilter===k}">${esc(k)}<b>${tally[k].n}</b></button>`)).join(""):"";
  $("names").innerHTML=seeAll?tk.map(k=>`<option value="${esc(k)}">`).join(""):"";
  const list=sorted(base).filter(r=>!seeAll||((!cat||r.category===cat)&&(!nameFilter||r.name===nameFilter)&&(!q||(r.name+r.content).includes(q))));
  $("count").textContent=seeAll&&rows.length?`${list.length}건`:"";
  $("listTitle").firstChild.textContent=seeAll?"누적 기록 ":"칭찬 모음 ";
  $("empty").hidden=base.length>0;
  $("empty").querySelector("p").innerHTML=seeAll
    ?"아직 기록이 없습니다.<br>왼쪽에서 친구 이름과 행동을 적고 <b>기록 저장</b>을 누르면 여기에 쌓입니다."
    :"아직 쓴 칭찬이 없어요.<br>왼쪽에서 친구를 칭찬해 보세요.";
  $("tbody").innerHTML=list.map(r=>`<tr>
    <td class="date">${esc(r.date)}</td><td class="num">${esc(r.num)}</td><td>${esc(r.name)}</td>
    <td><span class="chip">${esc(r.category)}</span></td><td class="content">${esc(r.content)}</td><td>${esc(r.writer)}</td>
    <td><div class="acts">${!canTouch(r)?"":pendingDel===r.id
      ?`<button class="btn-sm btn-danger" data-act="del-yes" data-id="${r.id}">삭제</button><button class="btn-sm btn-ghost" data-act="del-no">취소</button>`
      :`<button class="btn-sm btn-ghost" data-act="edit" data-id="${r.id}">수정</button><button class="btn-sm btn-ghost" data-act="del" data-id="${r.id}">삭제</button>`}</div></td></tr>`).join("");
}
$("fCat").addEventListener("change",render);
$("fText").addEventListener("input",render);
$("tally").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;nameFilter=b.dataset.n;render()});

$("showToggle").addEventListener("change",async e=>{
  const v=e.target.checked;
  if(!settingsRef){e.target.checked=!v;return}
  e.target.disabled=true;
  try{await settingsRef.set({showRecords:v});showRecords=v;render()}
  catch(_){e.target.checked=!v;$("toggleState").textContent="설정을 바꾸지 못했습니다. 다시 눌러 주세요."}
  finally{e.target.disabled=false}
});

function setMsg(t,err){$("msg").textContent=t;$("msg").className="msg"+(err?" err":"")}
function resetForm(){editingId=null;$("num").value="";$("name").value="";$("content").value="";$("date").value=today();$("cat0").checked=true;
  $("saveBtn").textContent="기록 저장";$("cancelEdit").hidden=true;$("formTitle").textContent="친구 칭찬하기"}
$("cancelEdit").addEventListener("click",()=>{resetForm();setMsg("")});

$("f").addEventListener("submit",async e=>{
  e.preventDefault();
  const rec={num:$("num").value?Number($("num").value):"",name:$("name").value.trim(),date:$("date").value,
    category:(document.querySelector('input[name="cat"]:checked')||{}).value||"기타",content:$("content").value.trim(),writer:$("writer").value.trim()};
  if(!rec.name){setMsg("칭찬할 친구 이름을 적어 주세요.",true);$("name").focus();return}
  if(!rec.content){setMsg("어떤 행동을 칭찬하는지 적어 주세요.",true);$("content").focus();return}
  if(!rec.writer){setMsg("쓴 사람(내 이름)을 적어 주세요.",true);$("writer").focus();return}
  if(!col){setMsg("저장 기능에 연결되지 않아 저장하지 못했습니다.",true);return}
  try{localStorage.setItem("writer",rec.writer)}catch(_){}
  $("saveBtn").disabled=true;
  try{
    if(editingId){const old=rows.find(r=>r.id===editingId)||{};
      await col.doc(editingId).set({...rec,authorId:old.authorId||myId||"",createdAt:old.createdAt||Date.now()});setMsg(`${rec.name} 칭찬을 수정했습니다.`)}
    else{await col.add({...rec,authorId:myId||"",createdAt:Date.now()});setMsg(`${rec.name} 칭찬을 저장했습니다. 고마워요!`)}
    resetForm();$("num").focus();
  }catch(err){setMsg(err&&err.code==="permission_denied"?"이 페이지에 기록할 권한이 없습니다. 선생님께 말씀드려 주세요.":"저장하지 못했습니다. 잠시 후 다시 눌러 주세요.",true)}
  finally{$("saveBtn").disabled=false}
});

$("tbody").addEventListener("click",async e=>{
  const b=e.target.closest("button");if(!b)return;const id=b.dataset.id,act=b.dataset.act;
  const r=rows.find(x=>x.id===id);
  if(act==="edit"&&r&&canTouch(r)){editingId=id;
    $("num").value=r.num;$("name").value=r.name;$("date").value=r.date;$("content").value=r.content;$("writer").value=r.writer||"";
    const i=CATS.indexOf(r.category);$("cat"+(i<0?6:i)).checked=true;
    $("saveBtn").textContent="수정 저장";$("cancelEdit").hidden=false;$("formTitle").textContent="칭찬 고치기";setMsg("");$("name").focus()}
  if(act==="del"){pendingDel=id;render()}
  if(act==="del-no"){pendingDel=null;render()}
  if(act==="del-yes"&&r&&canTouch(r)){pendingDel=null;try{await col.doc(id).delete()}catch(_){setMsg("삭제하지 못했습니다.",true)}}
});

$("exportBtn").addEventListener("click",async()=>{
  const m=$("exportMsg");m.className="msg";
  if(!rows.length){m.textContent="내보낼 기록이 없습니다.";return}
  if(!window.XLSX){m.className="msg err";m.textContent="시트 도구를 불러오지 못했습니다. 페이지를 새로고침해 주세요.";return}
  const list=sorted(rows).reverse();
  const recs=list.map(r=>({"날짜":r.date,"번호":r.num,"칭찬받은 학생":r.name,"칭찬 영역":r.category,"구체적인 행동":r.content,"쓴 사람":r.writer||""}));
  const t={};list.forEach(r=>{const k=r.name;t[k]=t[k]||{"번호":r.num,"이름":k,"합계":0};CATS.forEach(c=>t[k][c]=t[k][c]||0);
    const cc=CATS.includes(r.category)?r.category:"기타";t[k][cc]++;t[k]["합계"]++});
  const sum=Object.values(t).sort((a,b)=>(a["번호"]||999)-(b["번호"]||999));
  const wb=XLSX.utils.book_new();
  const ws1=XLSX.utils.json_to_sheet(recs);ws1["!cols"]=[{wch:12},{wch:6},{wch:12},{wch:12},{wch:60},{wch:12}];
  const ws2=XLSX.utils.json_to_sheet(sum,{header:["번호","이름",...CATS,"합계"]});ws2["!cols"]=[{wch:6},{wch:10},...CATS.map(()=>({wch:10})),{wch:8}];
  XLSX.utils.book_append_sheet(wb,ws1,"전체 기록");XLSX.utils.book_append_sheet(wb,ws2,"학생별 합계");
  const buf=XLSX.write(wb,{bookType:"xlsx",type:"array"});
  const cls=$("className").value.trim();
  const dl=await claude.use("downloads");
  if(!dl){m.className="msg err";m.textContent="이 화면에서는 파일 저장을 지원하지 않습니다. claude.ai에서 열어 주세요.";return}
  try{await dl.save({filename:`${cls?cls+"_":""}칭찬기록_${today()}.xlsx`,data:new Blob([buf])});m.textContent="시트 파일을 저장했습니다."}
  catch(err){if(err&&err.code==="declined"){m.textContent="저장을 취소했습니다."}else{m.className="msg err";m.textContent="파일을 저장하지 못했습니다. 잠시 후 다시 시도해 주세요."}}
});

render();
(async()=>{
  const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
  if(user){const me=await user.me();isTeacher=!!(me.isOwner||me.canEdit);myId=me.id}
  $("teacherBar").hidden=!isTeacher;
  if(!db){$("offline").hidden=false;settingsLoaded=true;render();return}
  col=db.collection("records");
  settingsRef=db.doc("settings/board");
  settingsRef.onSnapshot(s=>{const d=s.exists?dataOf(s):null;showRecords=!!(d&&d.showRecords);settingsLoaded=true;render()},
    ()=>{settingsLoaded=true;render()});
  col.onSnapshot(s=>{rows=s.docs.map(d=>({id:d.id,...dataOf(d)}));if(pendingDel&&!rows.some(r=>r.id===pendingDel))pendingDel=null;render()},
    ()=>{$("offline").hidden=false});
})();
</script>
