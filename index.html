<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>2학년 8반</title>
<meta name="theme-color" content="#f7f9f6">
<link rel="icon" href="goals/icons/icon-192.png">
<style>
@font-face{font-family:"BM Kkubulim";src:url("fonts/BMkkubulim-title.woff2") format("woff2");font-display:swap}
@font-face{font-family:"Chosun Ilbo Myungjo";src:url("fonts/ChosunIlboMyungjo.woff") format("woff");font-display:swap}
/* Layout: 모눈종이 위 학급 게시판 — 큰 반 이름, 아래에 바로가기 카드 */
:root{
  --paper:#f7f9f6; --grid:#e6ece8; --sheet:#ffffff; --ink:#2b3440; --muted:#68727c; --line:#dbe2de;
  --mint:#d6ecdf; --coral:#fcebe7; --sky:#e7f0fa; --accent:#e9806e;
  --f-display:"BM Kkubulim","Chosun Ilbo Myungjo",serif;
  --f-body:"Chosun Ilbo Myungjo","Nanum Myeongjo","AppleMyungjo","Batang",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#151a1d; --grid:#1f272b; --sheet:#1c2327; --ink:#e8ecee; --muted:#9ba6ad; --line:#2e383d;
  --mint:#24392e; --coral:#3a2622; --sky:#1e2a36; --accent:#f09a8a; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#151a1d; --grid:#1f272b; --sheet:#1c2327; --ink:#e8ecee; --muted:#9ba6ad; --line:#2e383d;
  --mint:#24392e; --coral:#3a2622; --sky:#1e2a36; --accent:#f09a8a; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background-color:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;letter-spacing:-0.04em;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:max(40px,env(safe-area-inset-top,0px)) max(48px,env(safe-area-inset-bottom,0px))}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
header{border-bottom:1px solid var(--ink);padding-bottom:16px}
.eyebrow{font-size:13px;color:var(--muted);letter-spacing:.02em;margin:0}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(44px,9vw,72px);line-height:1.1;margin:4px 0 6px;letter-spacing:0}
.sub{margin:0;color:var(--muted)}
.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
a.card{display:flex;gap:16px;align-items:flex-start;text-decoration:none;color:var(--ink);background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:20px;transition:transform .15s,border-color .15s}
a.card:hover{transform:translateY(-2px);border-color:var(--ink)}
a.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:56px;height:56px;flex:none;border-radius:10px;display:grid;place-items:center}
.ic svg{width:36px;height:36px}
.card h2{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0;letter-spacing:0;line-height:1.25}
.card p{margin:4px 0 0;font-size:14px;color:var(--muted)}
.go{font-size:13px;color:var(--accent);margin-top:8px;display:inline-block}
footer{font-size:12.5px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">우리들의 학급 공간</p>
    <h1>2학년 8반</h1>
    <p class="sub">반가워요! 아래에서 들어갈 곳을 골라 주세요.</p>
  </header>

  <nav class="links" aria-label="학급 바로가기">
    <a class="card" href="goals/">
      <span class="ic" style="background:var(--mint)">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 6l9 14h-4l8 11h-5l7 9H9l7-9h-5l8-11h-4z" fill="#b9dcc6" stroke="#5f9a78" stroke-width="1.6" stroke-linejoin="round"/><rect x="21" y="40" width="6" height="5" fill="#c9a882"/><circle cx="20" cy="27" r="2.4" fill="#f28ba8"/><circle cx="28" cy="33" r="2.4" fill="#7fb7e6"/><circle cx="25" cy="19" r="2.2" fill="#f6c945"/></svg>
      </span>
      <span>
        <h2>기말고사 목표 트리</h2>
        <p>나의 기말고사 목표를 장식에 담아 트리에 달아요. 목표를 이루면 선생님 도장과 함께 장식에 불이 켜져요.</p>
        <span class="go">열기 →</span>
      </span>
    </a>
    <a class="card" href="praise/">
      <span class="ic" style="background:var(--coral)">
        <svg viewBox="0 0 48 48" aria-hidden="true"><rect x="10" y="7" width="28" height="35" rx="3" fill="#fff" stroke="#c76a50" stroke-width="1.6"/><path d="M16 17h16M16 23h16M16 29h10" stroke="#e9a493" stroke-width="1.6" stroke-linecap="round"/><circle cx="33" cy="35" r="7" fill="none" stroke="#d9483b" stroke-width="1.8"/><path d="M30 35l2 2 4-4" stroke="#d9483b" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
      </span>
      <span>
        <h2>우리반 칭찬 기록부</h2>
        <p>친구의 모범 행동을 보면 그때그때 칭찬으로 남겨요. 장난이 아닌 진심으로 써 주세요.</p>
        <span class="go">열기 →</span>
      </span>
    </a>
  </nav>

  <footer>2학년 8반 · 담임 선생님이 운영하는 학급 사이트예요</footer>
</div>
</body>
</html>
