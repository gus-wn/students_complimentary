<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZEP 매거진 · 2학년 8반</title>
<link rel="icon" href="../goals/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@400;700;800&family=Gaegu:wght@400;700&family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"Chosun Ilbo Myungjo";src:url("../fonts/ChosunIlboMyungjo.woff") format("woff");font-display:swap}

:root{
  --paper:#fdfcf8;
  --ink:#2a2d33;
  --soft:#6b7280;
  --line:#d9dee5;
  --grid:#edf1f5;
  --sky:#cfe5f4;
  --sky-ink:#3d7fae;
  --blossom:#f6d7de;
  --mint:#d6eee2;
  --butter:#f6ecc8;
  --display:"Playfair Display","Nanum Myeongjo",serif;
  --head:"Chosun Ilbo Myungjo","Nanum Myeongjo",serif;
  --body:"Chosun Ilbo Myungjo","Gowun Batang","Nanum Myeongjo",serif;
  --hand:"Kkubulim","꾸불림체","Gaegu",cursive;
  /* 레이아웃: A4 세로(210×297mm) 페이지를 쌓고, 페이지마다 모눈 배경 + 얇은 선 + 파스텔 포인트 */
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#e9ebee;color:var(--ink);font-family:var(--body);font-size:10.5pt;line-height:1.7;-webkit-print-color-adjust:exact;print-color-adjust:exact}

/* ---------- 상단 도구 막대 (인쇄되지 않음) ---------- */
.toolbar{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px;background:#ffffffee;backdrop-filter:blur(6px);border-bottom:1px solid var(--line);font-family:"Gowun Batang",serif;font-size:13px}
.toolbar .home{color:var(--sky-ink);text-decoration:none;margin-right:4px}
.toolbar .home:hover{text-decoration:underline}
.toolbar b{font-family:var(--display);font-size:15px;margin-right:6px}
.toolbar button{font:inherit;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;cursor:pointer;color:var(--ink)}
.toolbar button:hover{background:var(--sky)}
.toolbar button:focus-visible,[contenteditable]:focus-visible,.ph:focus-visible{outline:2px solid var(--sky-ink);outline-offset:2px}
.toolbar .status{color:var(--sky-ink);font-size:12px}
.toolbar .tip{color:var(--soft);margin-left:auto}
.notice{display:none;max-width:210mm;margin:12px auto 0;padding:10px 14px;background:var(--butter);border:1px solid #e6d79c;border-radius:8px;font-size:13px}
.notice.show{display:block}

/* ---------- 페이지 ---------- */
.pages{counter-reset:pg;display:flex;flex-direction:column;align-items:center;gap:14mm;padding:12mm 16px 24mm}
.page{counter-increment:pg;position:relative;width:210mm;height:297mm;overflow:hidden;background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:5mm 5mm;box-shadow:0 2px 14px rgba(30,40,60,.12);padding:16mm 16mm 18mm;display:flex;flex-direction:column;gap:6mm}
.run{display:flex;justify-content:space-between;align-items:center;font-family:var(--display);font-size:8pt;letter-spacing:.18em;text-transform:uppercase;color:var(--soft);border-bottom:.3mm solid var(--ink);padding-bottom:2mm}
.folio .pn::before{content:counter(pg,decimal-leading-zero)}
.lang{font-family:var(--display);font-size:7.5pt;font-weight:700;letter-spacing:.12em;border:.3mm solid currentColor;border-radius:99px;padding:.3mm 2.5mm;margin-left:2mm}
.folio{position:absolute;bottom:9mm;left:16mm;right:16mm;display:flex;justify-content:space-between;font-family:var(--display);font-size:8pt;color:var(--soft);border-top:.2mm solid var(--line);padding-top:2mm}

h1,h2,h3{font-family:var(--head);margin:0;text-wrap:balance;line-height:1.25}
p{margin:0}
.kicker{font-family:var(--display);font-style:italic;font-size:10pt;color:var(--sky-ink);letter-spacing:.04em}
.hand{font-family:var(--hand);font-size:14pt;line-height:1.35}
.tag{display:inline-block;font-family:var(--head);font-size:8pt;font-weight:700;padding:.6mm 3mm;border-radius:99px;background:var(--sky);color:var(--ink)}
.tag.pink{background:var(--blossom)}.tag.mint{background:var(--mint)}.tag.butter{background:var(--butter)}

/* 사진 자리 */
.ph{position:relative;border:.3mm dashed #a9b4c2;border-radius:2mm;background:#ffffffb3 center/cover no-repeat;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--soft);font-family:"Gowun Batang",serif;font-size:9pt;text-align:center;min-height:30mm}
.ph.filled{border:.3mm solid var(--ink)}
.ph.filled span{display:none}
.ph span{padding:2mm}

[contenteditable]{border-radius:1mm}
[contenteditable]:hover{background:#cfe5f455}
.placeholder{color:#9aa3ae}

/* ---------- 1. 표지 ---------- */
.cover{padding:14mm 14mm 16mm}
.mast{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:.6mm solid var(--ink);padding-bottom:2mm}
.mast .title{font-family:var(--display);font-weight:900;font-size:62pt;line-height:.9;letter-spacing:-.02em}
.mast .title i{color:var(--sky-ink)}
.mast .issue{text-align:right;font-family:var(--display);font-size:9pt;line-height:1.5}
.cover-sub{display:flex;justify-content:space-between;font-size:9pt;color:var(--soft);font-family:var(--head)}
.cover-body{flex:1;display:grid;grid-template-columns:1fr 58mm;gap:6mm;min-height:0}
.cover-body .ph{height:100%}
.coverlines{display:flex;flex-direction:column;gap:5mm;border-left:.3mm solid var(--ink);padding-left:5mm}
.coverlines .no{font-family:var(--display);font-size:26pt;font-weight:900;color:var(--sky-ink);line-height:1}
.coverlines h3{font-size:13pt}
.coverlines p{font-size:9pt;color:var(--soft)}
.cover-head{font-family:var(--head);font-weight:800;font-size:24pt;line-height:1.25}
.cover-head em{font-style:normal;background:linear-gradient(transparent 60%,var(--blossom) 60%)}
.cover-foot{display:flex;justify-content:space-between;align-items:flex-end}
.mingti{width:22mm;height:22mm;min-height:0;border-radius:50%;font-size:7pt}

/* ---------- 2. 목차 / 편집자의 글 ---------- */
.toc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10mm;flex:1}
.toc h2{font-family:var(--display);font-size:34pt;font-weight:900}
.toc ol{list-style:none;padding:0;margin:6mm 0 0;display:flex;flex-direction:column}
.toc li{display:grid;grid-template-columns:12mm 1fr auto;gap:3mm;align-items:baseline;padding:3mm 0;border-bottom:.2mm solid var(--line)}
.toc li .n{font-family:var(--display);font-weight:700;color:var(--sky-ink)}
.toc li .p{font-family:var(--display);font-variant-numeric:tabular-nums;color:var(--soft)}
.letter{background:#ffffffcc;border:.3mm solid var(--ink);border-radius:2mm;padding:7mm;display:flex;flex-direction:column;gap:4mm}
.letter h3{font-size:14pt}
.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:4mm}
.flow .step{border-top:.6mm solid var(--ink);padding-top:2.5mm;display:flex;flex-direction:column;gap:1.5mm}
.flow .when{font-family:var(--display);font-weight:700;font-size:9pt;color:var(--sky-ink)}
.flow h3{font-size:11pt}
.flow p{font-size:9pt;color:var(--soft);line-height:1.55}

/* ---------- 섹션 오프너 ---------- */
.opener{display:grid;grid-template-columns:1fr 1fr;gap:8mm;align-items:end}
.part{font-family:var(--display);font-weight:900;font-size:72pt;line-height:.85;color:var(--sky)}
.part.pink{color:var(--blossom)}
.opener h2{font-size:22pt}
.lede{font-family:var(--head);font-size:11.5pt;line-height:1.75}

/* 정보 표 */
.info{width:100%;border-collapse:collapse;font-size:9.5pt}
.info th{width:32mm;text-align:left;vertical-align:top;font-family:var(--head);font-weight:700;padding:2.5mm 3mm;background:var(--sky);border-bottom:.2mm solid #fff}
.info td{padding:2.5mm 3mm;border-bottom:.2mm solid var(--line);background:#ffffffb3}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:6mm}
.box{border:.3mm solid var(--ink);border-radius:2mm;padding:5mm;background:#ffffffcc;display:flex;flex-direction:column;gap:2.5mm}
.box h3{font-size:11.5pt;display:flex;gap:2mm;align-items:center}
.box ul{margin:0;padding-left:4.5mm}
.box li{margin:.5mm 0}
.dropcap::first-letter{font-family:var(--head);font-weight:800;float:left;font-size:30pt;line-height:1;margin:1mm 2mm 0 0;color:var(--sky-ink)}

/* 구현 내역 표 */
.impl{width:100%;border-collapse:collapse;table-layout:fixed}
.impl thead th{font-family:var(--head);font-size:9pt;text-align:left;padding:2mm 3mm;border-top:.6mm solid var(--ink);border-bottom:.3mm solid var(--ink)}
.impl td{vertical-align:top;padding:3mm;border-bottom:.2mm solid var(--line)}
.impl td:first-child{width:14mm;font-family:var(--display);font-weight:900;font-size:18pt;color:var(--sky-ink)}
.impl .ph{height:42mm}
.impl h3{font-size:10.5pt;margin-bottom:1.5mm}
.impl p{font-size:9pt;line-height:1.6}
.impl .key{display:inline-block;font-family:var(--display);font-weight:700;font-size:8pt;border:.3mm solid var(--ink);border-radius:1mm;padding:0 1.5mm;margin-right:1mm}

/* ---------- 지역 명소 특집 ---------- */
.feature{display:grid;grid-template-columns:1.25fr 1fr;gap:6mm;flex:1;min-height:0}
.feature .big{height:100%}
.spot-side{display:flex;flex-direction:column;gap:4mm}
.spot-side .ph{height:40mm}
.facts{display:grid;grid-template-columns:auto 1fr;gap:1.5mm 3mm;font-size:9pt;border-top:.3mm solid var(--ink);border-bottom:.3mm solid var(--ink);padding:3mm 0}
.facts dt{font-family:var(--head);font-weight:700}
.facts dd{margin:0}
.pull{font-family:var(--head);font-weight:800;font-size:15pt;line-height:1.4;border-left:1.2mm solid var(--blossom);padding-left:4mm}
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:4mm}
.card{background:#ffffffcc;border:.2mm solid var(--line);border-top:1mm solid var(--mint);border-radius:1.5mm;padding:3.5mm;display:flex;flex-direction:column;gap:1.5mm}
.card:nth-child(2){border-top-color:var(--butter)}
.card:nth-child(3){border-top-color:var(--blossom)}
.card h3{font-size:10.5pt}
.card p{font-size:8.8pt;line-height:1.55}
.card .ph{height:30mm}

/* ZEP 구현 */
.mapflow{display:flex;align-items:center;gap:3mm;font-family:var(--head);font-size:9pt}
.mapflow .node{flex:1;text-align:center;border:.3mm solid var(--ink);border-radius:99px;padding:2mm 1mm;background:#fff}
.mapflow .node.on{background:var(--sky)}
.mapflow .arr{color:var(--soft);font-family:var(--display)}
.shots{display:grid;grid-template-columns:repeat(2,1fr);gap:5mm}
.shot{display:flex;flex-direction:column;gap:1.5mm}
.shot .ph{height:52mm}
.shot figcaption{font-size:8.8pt;line-height:1.5}
.shot figcaption b{font-family:var(--head)}
figure{margin:0}

/* ---------- 초대장 ---------- */
.invite{flex:1;display:grid;grid-template-columns:1fr 52mm;gap:7mm;min-height:0}
.paper{position:relative;background:#fff;border:.3mm solid var(--ink);border-radius:2mm;padding:9mm 9mm 9mm 13mm;
  background-image:repeating-linear-gradient(transparent 0 8.4mm,#e3e8ee 8.4mm 8.6mm);background-position:0 7mm}
.paper::before{content:"";position:absolute;top:0;bottom:0;left:8mm;border-left:.4mm solid var(--blossom)}
.paper .hand{font-size:15pt;line-height:8.6mm}
.paper .hand p{margin:0}
.side{display:flex;flex-direction:column;gap:5mm}
.qr{background:#fff;border:.3mm solid var(--ink);border-radius:2mm;padding:4mm;display:flex;flex-direction:column;align-items:center;gap:2mm;text-align:center}
.qrbox{width:40mm;height:40mm;display:flex;align-items:center;justify-content:center;color:var(--soft);font-size:8pt;border:.2mm dashed var(--line)}
.qrbox img,.qrbox canvas{width:40mm!important;height:40mm!important}
.url{font-family:var(--display);font-size:7.5pt;word-break:break-all;color:var(--sky-ink)}
.howto{counter-reset:h;list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:2mm;font-size:9pt}
.howto li{counter-increment:h;display:grid;grid-template-columns:6mm 1fr;gap:2mm}
.howto li::before{content:counter(h);font-family:var(--display);font-weight:900;color:#fff;background:var(--sky-ink);border-radius:50%;width:5.5mm;height:5.5mm;display:flex;align-items:center;justify-content:center;font-size:8pt}

/* ---------- 뒷표지 ---------- */
.reflect{display:grid;grid-template-columns:repeat(3,1fr);gap:5mm}
.credits{display:grid;grid-template-columns:repeat(4,1fr);gap:3mm;font-size:9pt}
.credits div{background:#ffffffcc;border:.2mm solid var(--line);border-radius:1.5mm;padding:2.5mm;text-align:center}
.credits b{display:block;font-family:var(--head)}
.back-end{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;border-top:.6mm solid var(--ink);padding-top:3mm}
.back-end .title{font-family:var(--display);font-weight:900;font-size:30pt;line-height:1}
.back-end .title i{color:var(--sky-ink)}

/* ---------- 인쇄 ---------- */
@page{size:A4;margin:0}
@media print{
  body{background:none}
  .toolbar,.notice{display:none!important}
  .pages{padding:0;gap:0}
  .page{box-shadow:none;break-after:page;page-break-after:always}
  .page:last-child{break-after:auto}
  .ph:not(.filled){border-color:#cfd6df}
  .ph:not(.filled) span{visibility:hidden}
  [contenteditable]:hover{background:none}
}
/* 화면이 좁을 때(휴대폰)는 페이지를 축소해서 보여줌 */
@media screen and (max-width:820px){
  .pages{zoom:.46}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- 조별 공동 편집 ---------- */
.toolbar{flex-direction:column;align-items:stretch;gap:6px}
.tb-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.groups{display:flex;gap:4px;flex-wrap:wrap}
.groups a{font-family:var(--head);font-weight:700;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px}
.groups a:hover{background:var(--sky)}
.groups a.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.groups a:focus-visible,.gcard:focus-visible{outline:2px solid var(--sky-ink);outline-offset:2px}
.toolbar .status{margin-left:auto;font-size:12.5px;color:var(--sky-ink)}
.toolbar .status.bad{color:#b4523f}
.toolbar .tip{margin-left:0;font-size:12px}
.no-g .g-only{display:none}
.lockbar{max-width:210mm;margin:12px auto 0;padding:10px 14px;background:var(--blossom);border-radius:8px;font-size:13px;text-align:center}
.url-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.url-row input{flex:1;min-width:220px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;font:inherit}
.url-row button{font:inherit;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--sky);cursor:pointer}

.landing{max-width:760px;margin:40px auto;padding:0 16px;display:flex;flex-direction:column;gap:14px}
.landing h1{font-size:30px}
.landing-sub{color:var(--soft)}
.gcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:8px}
.gcard{display:flex;flex-direction:column;gap:4px;text-decoration:none;color:var(--ink);background:#fff;border:1px solid var(--line);border-top:5px solid var(--sky);border-radius:10px;padding:16px;transition:transform .15s}
.gcard:nth-child(2){border-top-color:var(--blossom)}.gcard:nth-child(3){border-top-color:var(--mint)}.gcard:nth-child(4){border-top-color:var(--butter)}.gcard:nth-child(5){border-top-color:#d9d2f0}
.gcard:hover{transform:translateY(-2px);border-color:var(--ink)}
.gnum{font-family:var(--display);font-weight:900;font-size:40px;line-height:1;color:var(--sky-ink)}
.glabel{font-family:var(--head);font-weight:700;font-size:16px}
.ggo{font-size:12px;color:var(--soft)}

/* 사진 칸: 사진 추가 버튼 + 끌어다 놓기 */
.ph .ph-add{position:absolute;left:50%;bottom:2.5mm;transform:translateX(-50%);padding:.8mm 3.5mm;font-size:8pt;white-space:nowrap;color:var(--sky-ink);background:#fff;border:.3mm solid var(--sky-ink);border-radius:99px}
.ph:hover .ph-add{background:var(--sky)}
.ph.mingti .ph-add{display:none}
.ph .ph-tools{position:absolute;top:1.5mm;right:1.5mm;display:none;gap:1mm;padding:0}
.ph.filled .ph-tools{display:flex}
.ph.filled:not(:hover):not(:focus-within) .ph-tools{opacity:0}
.ph-tools button{font:8pt "Gowun Batang",serif;background:#ffffffee;border:.3mm solid var(--line);border-radius:99px;padding:.4mm 2.5mm;cursor:pointer;color:var(--ink)}
.ph-tools button:hover{background:var(--sky)}
.ph.drag{outline:.7mm solid var(--sky-ink);outline-offset:-.7mm;background-color:var(--sky)}
.ph.drag::after{content:"여기에 놓으세요";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10pt;color:var(--sky-ink);background:#cfe5f4cc}
.ph.busy::after{content:"사진 올리는 중…";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:9pt;color:var(--ink);background:#ffffffaa}
.locked .ph{cursor:default}
.locked .ph-add,.locked .ph-tools{display:none!important}
.locked [contenteditable]:hover{background:none}

/* 선생님 관리 */
.panel-bg{position:fixed;inset:0;z-index:50;background:rgba(30,35,45,.35);display:flex;align-items:flex-start;justify-content:center;padding:60px 16px;overflow:auto}
.panel-bg[hidden]{display:none}
.panel{width:min(720px,100%);background:#fff;border-radius:12px;padding:20px;font-family:"Gowun Batang",serif;font-size:14px;box-shadow:0 10px 40px rgba(0,0,0,.2);display:flex;flex-direction:column;gap:12px}
.panel-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--ink);padding-bottom:8px}
.panel-head h2{font-size:20px}
.panel button,.panel .acts a{font:inherit;font-size:13px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;cursor:pointer;color:var(--ink);text-decoration:none;display:inline-block}
.panel button:hover,.panel .acts a:hover{background:var(--sky)}
.panel button:disabled{opacity:.6;cursor:wait}
.panel .is-locked{background:var(--blossom)}
.login{display:flex;flex-direction:column;gap:8px}
.login .row{display:flex;gap:6px}
.login input{flex:1;padding:8px;border:1px solid var(--line);border-radius:8px;font:inherit}
.err{color:#b4523f;margin:0}
.muted{color:var(--soft);font-size:12.5px;margin:0}
.tt{width:100%;border-collapse:collapse}
.tt th,.tt td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.tt thead th{font-size:12px;color:var(--soft);font-weight:400}
.tt tbody th{font-family:var(--head);font-size:16px}
.tt td{font-variant-numeric:tabular-nums}
.acts{display:flex;flex-wrap:wrap;gap:4px}
.row-end{display:flex;gap:6px;justify-content:flex-end;margin:0}

/* PDF용 숨은 작업대 */
#pdfStage{position:absolute;left:-12000px;top:0;width:210mm;counter-reset:pg}
#pdfStage .page{box-shadow:none;margin:0}
#pdfStage .ph-add,#pdfStage .ph-tools,#pdfStage .ph:not(.filled) span{display:none!important}
#pdfStage .ph:not(.filled){border-color:#cfd6df}

@media print{
  .lockbar,.landing,.panel-bg,#pdfStage{display:none!important}
  .ph-add,.ph-tools{display:none!important}
}
</style>
</head>
<body>

<div class="toolbar">
  <div class="tb-row">
    <a class="home" href="../">← 2학년 8반</a>
    <b>ZEP Magazine</b>
    <nav class="groups" id="groupNav" aria-label="조 선택 (새 창에서 열림)"></nav>
    <span class="status" id="status" aria-live="polite"></span>
  </div>
  <div class="tb-row">
    <button type="button" id="btnUrl" class="g-only">ZEP 링크 입력 → QR 만들기</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function(){
"use strict";
/* 칭찬 기록부·목표 트리와 같은 구글 시트 웹 앱 주소 */
var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwTmFh_ie9AU47PoqPCwLp0Uf5uuPn3h2z-UQg9-PWqUii6dUYQtmEakhXdY3gd0x_ntw/exec";
var GROUPS = 5;
var H2C = "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";
var JSPDF = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";

function $(id){ return document.getElementById(id); }
var params = new URLSearchParams(location.search);
var G = parseInt(params.get("g"), 10);
var hasG = G >= 1 && G <= GROUPS;
var pagesEl = $("pages"), notice = $("notice"), statusEl = $("status"), fileIn = $("fileIn");
var TPL = $("tpl").innerHTML;

var mode = "local";            // server: 사이트에 저장 / local: 이 기기에만
var state = { fields:{}, photos:{}, locked:false };
var dirty = new Map();         // 아직 사이트에 못 보낸 칸
var photoCache = {};
var locked = false, sending = false, sendTimer = null, currentPh = null;
var LKEY = "zep-mag-g" + G;

/* ---------- 공통 ---------- */
function say(msg){ notice.textContent = msg; notice.classList.add("show"); }
function hush(){ notice.classList.remove("show"); }
function setStatus(t, bad){ statusEl.textContent = t; statusEl.classList.toggle("bad", !!bad); }
function hhmm(ms){ var d = ms ? new Date(ms) : new Date(); return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0"); }
function when(ms){ if(!ms) return "아직 없음"; var d = new Date(ms); return (d.getMonth()+1) + "/" + d.getDate() + " " + hhmm(ms); }
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function ssGet(k){ try{ return sessionStorage.getItem(k); }catch(e){ return null; } }
function ssSet(k,v){ try{ if(v==null) sessionStorage.removeItem(k); else sessionStorage.setItem(k,v); }catch(e){} }

function api(q){
  return fetch(SCRIPT_URL + "?" + q + "&t=" + Date.now()).then(function(r){ return r.json(); });
}
function post(body){
  return fetch(SCRIPT_URL, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body:JSON.stringify(body) })
    .then(function(r){ return r.json(); });
}

/* 다른 친구가 쓴 글을 화면에 넣기 전에 허용한 태그만 남깁니다 */
var OK_TAGS = { BR:1, P:1, DIV:1, B:1, I:1, EM:1, STRONG:1, U:1, SPAN:1 };
function clean(html){
  var t = document.createElement("template");
  t.innerHTML = String(html || "");
  (function walk(node){
    Array.prototype.slice.call(node.childNodes).forEach(function(c){
      if(c.nodeType === 3) return;
      if(c.nodeType !== 1){ c.remove(); return; }
      if(!OK_TAGS[c.tagName]){ c.replaceWith(document.createTextNode(c.textContent)); return; }
      var isKey = c.classList.contains("key"), ta = c.style && c.style.textAlign;
      Array.prototype.slice.call(c.attributes).forEach(function(a){ c.removeAttribute(a.name); });
      if(isKey) c.className = "key";
      if(ta === "right" || ta === "center") c.style.textAlign = ta;
      walk(c);
    });
  })(t.content);
  return t.innerHTML;
}

/* ---------- 매거진 만들기 ---------- */
function build(box, g){
  box.innerHTML = TPL.split("{{G}}").join(String(g));
  box.querySelectorAll(".ed").forEach(function(el, i){ el.dataset.k = "e" + i; });
  box.querySelectorAll(".ph").forEach(function(ph){
    ph.insertAdjacentHTML("beforeend",
      '<span class="ph-add">＋ 사진 추가 · 끌어다 놓기</span>' +
      '<span class="ph-tools"><button type="button" data-act="change">바꾸기</button><button type="button" data-act="del">지우기</button></span>');
  });
}
function applyFields(box, fields, skipBusy){
  fields = fields || {};
  Object.keys(fields).forEach(function(k){
    if(k === "zep") return;
    var el = box.querySelector('[data-k="' + k + '"]');
    if(!el) return;
    if(skipBusy && (el === document.activeElement || el.contains(document.activeElement) || dirty.has(k))) return;
    var v = clean(fields[k]);
    if(el.innerHTML !== v){ el.innerHTML = v; }
    el.classList.remove("placeholder");
  });
  if(fields.zep && !(skipBusy && dirty.has("zep"))) makeQR(box, fields.zep);
}
function setPh(ph, src){
  if(src){ ph.style.backgroundImage = "url(" + src + ")"; ph.classList.add("filled"); }
  else { ph.style.backgroundImage = ""; ph.classList.remove("filled"); }
}
function getPhoto(id){
  if(photoCache[id]) return Promise.resolve(photoCache[id]);
  return api("type=magPhoto&id=" + encodeURIComponent(id)).then(function(r){
    if(!r || !r.ok) throw new Error("photo");
    photoCache[id] = r.data; return r.data;
  });
}
function applyPhotos(box, photos){
  photos = photos || {};
  var jobs = [];
  box.querySelectorAll(".ph").forEach(function(ph){
    if(ph.dataset.busy) return;
    var p = photos[ph.dataset.ph];
    if(!p){ if(ph.dataset.pid){ delete ph.dataset.pid; setPh(ph, null); } return; }
    if(ph.dataset.pid === p.id) return;
    ph.dataset.pid = p.id;
    jobs.push(getPhoto(p.id).then(function(src){ if(ph.dataset.pid === p.id) setPh(ph, src); }).catch(function(){}));
  });
  return Promise.all(jobs);
}
function makeQR(box, url){
  box.querySelectorAll(".urlText").forEach(function(t){ t.textContent = url; });
  box.querySelectorAll(".qrbox").forEach(function(q){
    q.innerHTML = "";
    if(window.QRCode) new QRCode(q, { text:url, width:300, height:300, colorDark:"#2a2d33", colorLight:"#ffffff", correctLevel:QRCode.CorrectLevel.M });
    else q.textContent = "QR 도구를 불러오지 못했어요";
  });
}

/* ---------- 조 버튼 (새 창) ---------- */
function groupLinks(){
  var nav = $("groupNav"), cards = $("gcards");
  for(var g = 1; g <= GROUPS; g++){
    var a = document.createElement("a");
    a.href = "?g=" + g; a.target = "zep-g" + g; a.rel = "noopener";
    a.textContent = g + "조";
    if(g === G){ a.className = "on"; a.setAttribute("aria-current", "page"); }
    nav.appendChild(a);
    var c = document.createElement("a");
    c.href = "?g=" + g; c.target = "zep-g" + g; c.rel = "noopener"; c.className = "gcard";
    c.innerHTML = '<span class="gnum">' + g + '</span><span class="glabel">' + g + '조 매거진</span><span class="ggo">새 창에서 열기 ↗</span>';
    cards.appendChild(c);
  }
}

/* ---------- 학생 화면: 저장 ---------- */
function saveLocal(){
  var all = Object.assign({}, state.fields, Object.fromEntries(dirty));
  lsSet(LKEY, JSON.stringify({ fields:all, pending:Object.fromEntries(dirty) }));
}
function scheduleSend(ms){ clearTimeout(sendTimer); sendTimer = setTimeout(send, ms); }
function send(){
  if(sending || !dirty.size || locked) return;
  if(mode !== "server"){ setStatus("이 기기에만 임시 저장됨", true); return; }
  sending = true;
  var batch = Object.fromEntries(dirty);
  setStatus("저장 중…");
  post({ action:"magSave", g:G, fields:batch }).then(function(r){
    if(r && r.locked){ dirty.clear(); setLocked(true); throw new Error(r.error); }
    if(!r || !r.ok) throw new Error((r && r.error) || "save");
    Object.keys(batch).forEach(function(k){ if(dirty.get(k) === batch[k]) dirty.delete(k); });
    Object.assign(state.fields, batch);
    saveLocal();
    setStatus("자동 저장됨 " + hhmm());
  }).catch(function(e){
    if(locked) return;
    setStatus("저장 실패 · 인터넷을 확인해 주세요 (이 기기에 보관 중, 다시 시도해요)", true);
    setTimeout(function(){ scheduleSend(0); }, 8000);
  }).then(function(){
    sending = false;
    if(dirty.size && !locked) scheduleSend(1500);
  });
}
function flushBeacon(){
  if(mode !== "server" || !dirty.size || locked || !navigator.sendBeacon) return;
  try{
    navigator.sendBeacon(SCRIPT_URL, new Blob([JSON.stringify({ action:"magSave", g:G, fields:Object.fromEntries(dirty) })], { type:"text/plain;charset=utf-8" }));
  }catch(e){}
}
function setLocked(v){
  locked = !!v;
  pagesEl.classList.toggle("locked", locked);
  $("lockbar").hidden = !locked;
  pagesEl.querySelectorAll("[data-k]").forEach(function(el){ el.setAttribute("contenteditable", locked ? "false" : "true"); });
  pagesEl.querySelectorAll(".ph").forEach(function(ph){ ph.setAttribute("tabindex", locked ? "-1" : "0"); });
}
function poll(){
  if(mode !== "server" || document.hidden) return;
  api("type=mag&g=" + G).then(function(r){
    if(!r || !r.mag) return;
    applyFields(pagesEl, r.fields, true);
    state.fields = Object.assign({}, r.fields);
    state.photos = r.photos || {};
    applyPhotos(pagesEl, state.photos);
    if(!!r.locked !== locked) setLocked(r.locked);
  }).catch(function(){});
}

/* ---------- 학생 화면: 사진 ---------- */
function compress(file){
  return new Promise(function(res, rej){
    var r = new FileReader();
    r.onerror = rej;
    r.onload = function(){
      var img = new Image();
      img.onerror = function(){ rej(new Error("decode")); };
      img.onload = function(){
        var max = 1200, s = Math.min(1, max / Math.max(img.width, img.height));
        var c = document.createElement("canvas");
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        var x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height);
        x.drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL("image/jpeg", 0.8));
      };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  });
}
function handleFile(ph, f){
  if(locked || !ph || !f) return;
  if(!/^image\//.test(f.type)){ say("사진 파일만 넣을 수 있어요."); return; }
  compress(f).then(function(data){
    setPh(ph, data);
    if(mode !== "server"){ setStatus("사진이 이 화면에만 보여요 (사이트 저장 연결 안 됨)", true); return; }
    ph.dataset.busy = "1"; ph.classList.add("busy");
    setStatus("사진 올리는 중…");
    return post({ action:"magPhoto", g:G, slot:ph.dataset.ph, data:data }).then(function(r){
      if(r && r.locked) setLocked(true);
      if(!r || !r.ok) throw new Error((r && r.error) || "photo");
      photoCache[r.id] = data; ph.dataset.pid = r.id;
      state.photos[ph.dataset.ph] = { id:r.id };
      setStatus("사진 저장됨 " + hhmm());
    }).catch(function(e){
      setStatus("사진 저장 실패 · 다시 넣어 주세요", true);
      if(e && e.message && e.message !== "photo" && e.message.length < 60) say(e.message);
    }).then(function(){ delete ph.dataset.busy; ph.classList.remove("busy"); });
  }).catch(function(){ say("이 사진은 열 수 없어요. JPG나 PNG 사진으로 넣어 주세요. (아이폰 HEIC 사진은 캡처해서 넣으면 돼요)"); });
}
function delPhoto(ph){
  if(locked) return;
  setPh(ph, null); delete ph.dataset.pid;
  delete state.photos[ph.dataset.ph];
  if(mode !== "server") return;
  setStatus("저장 중…");
  post({ action:"magPhotoDel", g:G, slot:ph.dataset.ph }).then(function(r){
    if(!r || !r.ok) throw 0; setStatus("자동 저장됨 " + hhmm());
  }).catch(function(){ setStatus("사진 지우기 실패 · 다시 시도해 주세요", true); });
}
function pick(ph){ if(locked) return; currentPh = ph; fileIn.value = ""; fileIn.click(); }

function wireEditing(){
  pagesEl.addEventListener("input", function(e){
    var el = e.target.closest && e.target.closest("[data-k]");
    if(!el || locked) return;
    el.classList.remove("placeholder");
    dirty.set(el.dataset.k, el.innerHTML);
    saveLocal();
    setStatus("입력 중…");
    scheduleSend(1500);
  });
  pagesEl.addEventListener("paste", function(e){
    if(!e.target.closest || !e.target.closest("[contenteditable]")) return;
    var t = (e.clipboardData || window.clipboardData).getData("text");
    e.preventDefault();
    document.execCommand("insertText", false, t);
  });
  pagesEl.addEventListener("click", function(e){
    var ph = e.target.closest(".ph"); if(!ph) return;
    var btn = e.target.closest("button[data-act]");
    if(btn){ e.stopPropagation(); if(btn.dataset.act === "del") delPhoto(ph); else pick(ph); return; }
    if(!ph.classList.contains("filled")) pick(ph);
  });
  pagesEl.addEventListener("keydown", function(e){
    var ph = e.target.classList && e.target.classList.contains("ph") ? e.target : null;
    if(ph && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); pick(ph); }
  });
  fileIn.addEventListener("change", function(){ handleFile(currentPh, fileIn.files && fileIn.files[0]); });

  var dragPh = null;
  pagesEl.addEventListener("dragover", function(e){
    var ph = e.target.closest(".ph");
    if(!ph || locked) return;
    e.preventDefault(); e.dataTransfer.dropEffect = "copy";
    if(dragPh !== ph){ if(dragPh) dragPh.classList.remove("drag"); dragPh = ph; ph.classList.add("drag"); }
  });
  pagesEl.addEventListener("dragleave", function(e){
    if(dragPh && !dragPh.contains(e.relatedTarget)){ dragPh.classList.remove("drag"); dragPh = null; }
  });
  pagesEl.addEventListener("drop", function(e){
    var ph = e.target.closest(".ph");
    if(dragPh){ dragPh.classList.remove("drag"); dragPh = null; }
    if(!ph) return;
    e.preventDefault();
    handleFile(ph, e.dataTransfer.files && e.dataTransfer.files[0]);
  });
  // 사진 칸 밖에 떨어뜨려도 사진 파일이 새 탭으로 열리지 않게
  window.addEventListener("dragover", function(e){ e.preventDefault(); });
  window.addEventListener("drop", function(e){ e.preventDefault(); });

  document.addEventListener("visibilitychange", function(){ if(document.hidden) flushBeacon(); else poll(); });
  window.addEventListener("pagehide", flushBeacon);
}

function initGroup(){
  document.title = G + "조 · ZEP 매거진";
  pagesEl.hidden = false;
  build(pagesEl, G);
  setLocked(false);
  var local = null;
  try{ local = JSON.parse(lsGet(LKEY) || "null"); }catch(e){}
  if(local && local.fields){ state.fields = local.fields; applyFields(pagesEl, local.fields); }
  wireEditing();
  setStatus("불러오는 중…");
  api("type=mag&g=" + G).then(function(r){
    if(!r || !r.mag) throw new Error("old");
    mode = "server";
    state = { fields:r.fields || {}, photos:r.photos || {}, locked:!!r.locked };
    applyFields(pagesEl, state.fields);
    setLocked(state.locked);
    if(local && local.pending && !locked){
      Object.keys(local.pending).forEach(function(k){
        dirty.set(k, local.pending[k]);
        var el = pagesEl.querySelector('[data-k="' + k + '"]');
        if(el) el.innerHTML = clean(local.pending[k]);
      });
      if(dirty.size) scheduleSend(500);
    }
    setStatus(r.updated ? "마지막 저장 " + when(r.updated) : "새 매거진이에요. 쓰는 대로 자동 저장돼요");
    return applyPhotos(pagesEl, state.photos);
  }).catch(function(e){
    mode = "local";
    if(e && e.message === "old"){
      setStatus("사이트 저장 준비 중 · 이 기기에만 임시 저장됨", true);
      say("선생님이 구글 시트 코드를 업데이트하면 사이트에 저장돼요. 그 전까지는 이 기기에만 임시로 보관됩니다.");
    } else {
      setStatus("인터넷 연결 확인 · 이 기기에만 임시 저장됨", true);
    }
  });
  setInterval(poll, 12000);
}

/* ---------- 상단 버튼 ---------- */
$("btnPrint").addEventListener("click", function(){
  say("인쇄 설정: 용지 A4, 여백 없음, ‘배경 그래픽’ 체크.");
  setTimeout(function(){ try{ window.print(); }catch(e){} }, 50);
});
$("btnUrl").addEventListener("click", function(){
  if(locked) return;
  notice.innerHTML = '<span class="url-row"><label for="zepUrl">ZEP 링크</label><input id="zepUrl" type="url" placeholder="https://zep.us/play/..."><button type="button" id="zepOk">QR 만들기</button></span>';
  notice.classList.add("show");
  var inp = $("zepUrl");
  inp.value = state.fields.zep || "";
  inp.focus();
  function ok(){
    var v = inp.value.trim(); if(!v) return;
    makeQR(pagesEl, v);
    state.fields.zep = v; dirty.set("zep", v); saveLocal(); scheduleSend(0);
    hush();
    var q = pagesEl.querySelector(".qrbox"); if(q) q.scrollIntoView({ behavior:"smooth", block:"center" });
  }
  $("zepOk").addEventListener("click", ok);
  inp.addEventListener("keydown", function(e){ if(e.key === "Enter") ok(); });
});

/* ---------- 선생님 관리 ---------- */
var tkey = ssGet("zep-tkey");
var panel = $("panel"), panelBody = $("panelBody");
function openPanel(){ panel.hidden = false; if(tkey) loadTeacher(); else showLogin(); }
function closePanel(){ panel.hidden = true; }
$("btnTeacher").addEventListener("click", openPanel);
$("panelClose").addEventListener("click", closePanel);
panel.addEventListener("click", function(e){ if(e.target === panel) closePanel(); });
document.addEventListener("keydown", function(e){ if(e.key === "Escape" && !panel.hidden) closePanel(); });

function showLogin(err){
  panelBody.innerHTML =
    '<form class="login" id="loginForm"><label for="tkeyIn">교사용 비밀번호 (구글 시트 ‘설정’ B4)</label>' +
    '<span class="row"><input id="tkeyIn" type="password" inputmode="numeric" autocomplete="off"><button type="submit">들어가기</button></span>' +
    '<p class="err" id="loginErr"></p></form>';
  if(err) $("loginErr").textContent = err;
  $("tkeyIn").focus();
  $("loginForm").addEventListener("submit", function(e){
    e.preventDefault();
    var v = $("tkeyIn").value.trim(); if(!v) return;
    tkey = v; loadTeacher();
  });
}
function loadTeacher(){
  panelBody.innerHTML = '<p class="muted">불러오는 중…</p>';
  post({ action:"magTeacher", key:tkey }).then(function(r){
    if(!r || r.ok === undefined) throw new Error("old");
    if(!r.ok){ tkey = null; ssSet("zep-tkey", null); showLogin(r.error || "비밀번호가 맞지 않아요."); return; }
    ssSet("zep-tkey", tkey);
    renderTeacher(r.groups);
  }).catch(function(){
    panelBody.innerHTML = '<p class="err">불러오지 못했어요. 구글 시트 코드를 업데이트하고 새 버전으로 배포했는지 확인해 주세요.</p>';
  });
}
function renderTeacher(groups){
  var rows = groups.map(function(x){
    return '<tr><th scope="row">' + x.g + '조</th>' +
      '<td>' + when(x.updated) + '</td>' +
      '<td>글 ' + x.fields + '칸 · 사진 ' + x.photos + '장</td>' +
      '<td class="acts">' +
        '<a href="?g=' + x.g + '" target="zep-g' + x.g + '" rel="noopener">열기 ↗</a>' +
        '<button type="button" data-pdf="' + x.g + '">PDF 다운</button>' +
        '<button type="button" data-lock="' + x.g + '" data-on="' + (x.locked ? 1 : 0) + '" class="' + (x.locked ? "is-locked" : "") + '">' + (x.locked ? "잠김 · 풀기" : "잠그기") + '</button>' +
      '</td></tr>';
  }).join("");
  panelBody.innerHTML =
    '<table class="tt"><thead><tr><th>조</th><th>마지막 저장</th><th>내용</th><th>관리</th></tr></thead><tbody>' + rows + '</tbody></table>' +
    '<p class="muted">PDF는 A4 10쪽 그대로 내려받아요(한 조에 20~40초). 잠그면 학생들이 더 고칠 수 없고 보기만 돼요. 발표 전에 잠가 두면 안전해요.</p>' +
    '<p class="row-end"><button type="button" id="refreshT">새로고침</button><button type="button" id="logoutT">나가기</button></p>';
  panelBody.querySelectorAll("[data-pdf]").forEach(function(b){ b.addEventListener("click", function(){ makePdf(Number(b.dataset.pdf), b); }); });
  panelBody.querySelectorAll("[data-lock]").forEach(function(b){
    b.addEventListener("click", function(){
      b.disabled = true;
      post({ action:"magLock", key:tkey, g:Number(b.dataset.lock), locked:b.dataset.on !== "1" }).then(function(r){
        if(!r || !r.ok) throw 0;
        if(hasG && Number(b.dataset.lock) === G) setLocked(r.locked);
        loadTeacher();
      }).catch(function(){ b.disabled = false; b.textContent = "실패 · 다시"; });
    });
  });
  $("refreshT").addEventListener("click", loadTeacher);
  $("logoutT").addEventListener("click", function(){ tkey = null; ssSet("zep-tkey", null); showLogin(); });
}

/* ---------- PDF 만들기 ---------- */
var libs = null;
function loadLibs(){
  if(libs) return libs;
  function load(src){ return new Promise(function(res, rej){ var s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
  libs = Promise.all([load(H2C), load(JSPDF)]).catch(function(e){ libs = null; throw e; });
  return libs;
}
function wait(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
function makePdf(g, btn){
  var label = btn.textContent, stage = $("pdfStage");
  function prog(t){ btn.textContent = t; }
  btn.disabled = true;
  prog("준비 중…");
  var dataP = (hasG && g === G)
    ? Promise.resolve({ fields:Object.assign({}, state.fields, Object.fromEntries(dirty)), photos:state.photos })
    : api("type=mag&g=" + g);
  Promise.all([loadLibs(), dataP]).then(function(arr){
    var data = arr[1] || {};
    build(stage, g);
    applyFields(stage, data.fields || {});
    prog("사진 불러오는 중…");
    return applyPhotos(stage, data.photos || {});
  }).then(function(){
    return (document.fonts && document.fonts.ready) || null;
  }).then(function(){ return wait(400); }).then(function(){
    var pdf = new window.jspdf.jsPDF({ unit:"mm", format:"a4", orientation:"portrait", compress:true });
    var pages = Array.prototype.slice.call(stage.querySelectorAll(".page"));
    var i = 0;
    function next(){
      if(i >= pages.length) return Promise.resolve();
      prog("PDF 만드는 중 " + (i + 1) + "/" + pages.length);
      return window.html2canvas(pages[i], { scale:2, backgroundColor:"#fdfcf8", logging:false }).then(function(c){
        if(i) pdf.addPage();
        pdf.addImage(c.toDataURL("image/jpeg", 0.9), "JPEG", 0, 0, 210, 297);
        i++;
        return next();
      });
    }
    return next().then(function(){ pdf.save(g + "조_ZEP매거진.pdf"); prog("완료!"); });
  }).catch(function(e){
    console.log(e);
    prog("실패 · 다시 시도");
  }).then(function(){
    stage.innerHTML = "";
    setTimeout(function(){ btn.textContent = label; btn.disabled = false; }, 2500);
  });
}

/* ---------- 시작 ---------- */
groupLinks();
if(hasG){
  initGroup();
} else {
  document.body.classList.add("no-g");
  $("landing").hidden = false;
  setStatus("");
}
})();

</script>
